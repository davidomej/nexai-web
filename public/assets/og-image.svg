<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d6e5c"/>
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#128C7E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#075E54;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#25D366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20c05a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="80"  r="200" fill="#25D366" opacity="0.08"/>
  <circle cx="100"  cy="550" r="160" fill="#25D366" opacity="0.06"/>
  <circle cx="600"  cy="620" r="120" fill="#25D366" opacity="0.05"/>

  <!-- WhatsApp icon bubble -->
  <rect x="480" y="100" width="240" height="240" rx="60" fill="url(#accent)"/>
  <!-- Robot face -->
  <rect x="540" y="155" width="120" height="90"  rx="16" fill="white" opacity="0.95"/>
  <circle cx="570" cy="195" r="14" fill="#128C7E"/>
  <circle cx="630" cy="195" r="14" fill="#128C7E"/>
  <circle cx="571" cy="196" r="6"  fill="white"/>
  <circle cx="631" cy="196" r="6"  fill="white"/>
  <rect   x="565" y="220"  width="70" height="8" rx="4" fill="#128C7E"/>
  <!-- Antenna -->
  <line x1="600" y1="155" x2="600" y2="130" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <circle cx="600" cy="122" r="10" fill="white"/>
  <!-- Bubble tail -->
  <polygon points="560,340 600,290 640,340" fill="url(#accent)"/>

  <!-- Signal waves -->
  <path d="M 650 150 Q 680 175 650 200" stroke="white" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 665 138 Q 705 175 665 212" stroke="white" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Brand name -->
  <text x="600" y="420" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1">Nexa AI</text>

  <!-- Tagline -->
  <text x="600" y="480" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#DCF8C6" text-anchor="middle" opacity="0.9">Tu peluquería agenda citas sola por WhatsApp</text>

  <!-- Bottom strip -->
  <rect x="0" y="555" width="1200" height="75" fill="#25D366" opacity="0.15"/>
  <text x="600" y="603" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#DCF8C6" text-anchor="middle" opacity="0.85">Desde 40€/mes · Primer mes GRATIS · nexaai.es</text>
</svg>
